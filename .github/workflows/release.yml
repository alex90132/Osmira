name: Release APK

# Publishes a signed release APK to GitHub Releases. Community "GitHub app
# stores" (Obtainium, Komi Store, RepoStore) poll /releases/latest and offer
# the APK as an update whenever a new tag is pushed — so cutting a release is
# the whole update mechanism.
#
# Trigger: push a version tag, e.g.  git tag v0.1.1 && git push origin v0.1.1
# (or run manually from the Actions tab).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version name (e.g. 0.1.1). Defaults to pubspec value."
        required: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.44.4"
  JAVA_VERSION: "17"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            V="${GITHUB_REF_NAME#v}"
          elif [ -n "${{ github.event.inputs.version }}" ]; then
            V="${{ github.event.inputs.version }}"
          else
            V="$(grep -E '^version:' pubspec.yaml | sed -E 's/version:\s*//; s/\+.*//')"
          fi
          # versionCode comes from the pubspec "+build" suffix so it's fully
          # predictable (github.run_number resets to 1 on a fresh repo, which
          # would look like a downgrade). Bump "+N" in pubspec.yaml per release.
          C="$(grep -E '^version:' pubspec.yaml | sed -E 's/.*\+//')"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "code=$C" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $V (code $C)"

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is missing — cannot sign the release."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/osmira-release.jks

      - name: Write key.properties
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          cat > android/key.properties <<EOF
          storePassword=${STORE_PASSWORD}
          keyPassword=${KEY_PASSWORD}
          keyAlias=${KEY_ALIAS}
          storeFile=osmira-release.jks
          EOF

      - name: Flutter pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build per-ABI release APKs (obfuscated)
        # One APK per ABI instead of a fat universal build — each is ~1/2 the size
        # and ships only the code its device runs. We only support the ABIs that
        # have a native libwg-go.so (arm64-v8a for phones, x86_64 for emulators).
        run: |
          flutter build apk --release \
            --split-per-abi \
            --target-platform android-arm64,android-x64 \
            --obfuscate --split-debug-info=build/symbols \
            --build-name="${{ steps.ver.outputs.version }}" \
            --build-number="${{ steps.ver.outputs.code }}"

      - name: Rename artifacts
        # osmira-<version>-<abi>.apk, e.g. osmira-0.1.0-arm64.apk / -x86_64.apk.
        run: |
          cd build/app/outputs/flutter-apk
          V="${{ steps.ver.outputs.version }}"
          declare -A MAP=( [arm64-v8a]=arm64 [x86_64]=x86_64 [armeabi-v7a]=arm )
          for f in app-*-release.apk; do
            abi="${f#app-}"; abi="${abi%-release.apk}"
            out="osmira-${V}-${MAP[$abi]:-$abi}.apk"
            cp "$f" "$out"
            echo "  $f -> $out"
          done
          ls -1 osmira-*.apk

      - name: Clean up signing material
        if: always()
        run: rm -f android/app/osmira-release.jks android/key.properties

      - name: Publish GitHub Release
        # Published with the built-in gh CLI (no third-party action, no Node
        # runtime pinning to worry about). The tag is already pushed, so this
        # just attaches notes + the per-ABI APKs to it.
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s failglob  # fail loudly if no APK matched the glob
          gh release create "$GITHUB_REF_NAME" \
            build/app/outputs/flutter-apk/osmira-*.apk \
            --title "Osmira ${{ steps.ver.outputs.version }}" \
            --generate-notes

      - name: Upload workflow artifact (manual runs)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v6
        with:
          name: osmira-apk
          path: app/build/app/outputs/flutter-apk/osmira-*.apk
