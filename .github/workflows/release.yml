name: Release APK

# Publishes a signed release APK to GitHub Releases. Community "GitHub app
# stores" (Obtainium, Komi Store, RepoStore) poll /releases/latest and offer
# the APK as an update whenever a new tag is pushed — so cutting a release is
# the whole update mechanism.
#
# Trigger: push a version tag, e.g.  git tag v0.1.1 && git push origin v0.1.1
# (or run manually from the Actions tab).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version name (e.g. 0.1.1). Defaults to pubspec value."
        required: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.44.4"
  JAVA_VERSION: "17"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            V="${GITHUB_REF_NAME#v}"
          elif [ -n "${{ github.event.inputs.version }}" ]; then
            V="${{ github.event.inputs.version }}"
          else
            V="$(grep -E '^version:' pubspec.yaml | sed -E 's/version:\s*//; s/\+.*//')"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $V"

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is missing — cannot sign the release."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/osmira-release.jks

      - name: Write key.properties
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          cat > android/key.properties <<EOF
          storePassword=${STORE_PASSWORD}
          keyPassword=${KEY_PASSWORD}
          keyAlias=${KEY_ALIAS}
          storeFile=osmira-release.jks
          EOF

      - name: Flutter pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build release APK (obfuscated)
        run: |
          flutter build apk --release \
            --obfuscate --split-debug-info=build/symbols \
            --build-name="${{ steps.ver.outputs.version }}" \
            --build-number="${{ github.run_number }}"

      - name: Rename artifact
        id: apk
        run: |
          SRC=build/app/outputs/flutter-apk/app-release.apk
          OUT="osmira-${{ steps.ver.outputs.version }}.apk"
          cp "$SRC" "$OUT"
          echo "path=app/$OUT" >> "$GITHUB_OUTPUT"

      - name: Clean up signing material
        if: always()
        run: rm -f android/app/osmira-release.jks android/key.properties

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: Osmira ${{ steps.ver.outputs.version }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: ${{ steps.apk.outputs.path }}

      - name: Upload workflow artifact (manual runs)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: osmira-apk
          path: ${{ steps.apk.outputs.path }}
